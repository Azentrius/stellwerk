<!doctype html>
<!-- Stellwerk's display. The hub fills in the placeholders (session, scale, build, version) when it serves the page.
     SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" class="pf-v6-theme-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="stellwerk-session" content="{{session}}">
    <meta name="stellwerk-scale" content="{{scale}}">
    <meta name="stellwerk-build" content="{{build}}">
    <title>Stellwerk</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/azentrius.css">
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="board">
      <div class="pages" id="pages">
      <div class="page page--agents" id="page-agents" role="region">
      <section class="col col--agents" aria-labelledby="agents-title">
        <h2 class="col__title" id="agents-title"><span data-text="agentsTitle"></span> <span class="count" id="agents-count"></span></h2>
        <ul class="entries agents" id="agents"></ul>
        <p class="agents-empty" id="agents-empty" data-text="noSessions" hidden></p>
      </section>
      <section class="col col--waiting" aria-labelledby="waiting-title">
        <h2 class="col__title" id="waiting-title"><span data-text="queueTitle"></span> <span class="count" id="waiting-count"></span></h2>
        <div class="waiting" id="waiting-list">
          <div class="queue" id="queue"></div>
          <section class="answers" id="answers-section" aria-labelledby="answers-title" hidden>
            <h3 class="section-title" id="answers-title" data-text="answersTitle"></h3>
            <ul class="entries" id="answers"></ul>
          </section>
          <section class="pulls" id="pulls-section" aria-labelledby="pulls-title" hidden>
            <h3 class="section-title" id="pulls-title" data-text="pullsTitle"></h3>
            <ul class="entries" id="pulls"></ul>
          </section>
        </div>
        <div class="az-empty all-clear" id="waiting-empty" hidden>
          <span class="az-empty__icon" id="all-clear-icon"></span>
          <p class="az-empty__title" data-text="allClear"></p>
        </div>
        <section class="decisions" id="decisions" hidden>
          <ul class="entries decisions__list" id="decisions-list" hidden></ul>
          <button type="button" class="decisions__toggle" id="decisions-toggle" aria-controls="decisions-list" aria-expanded="false"></button>
        </section>
        <div class="github-state" id="github-state" hidden></div>
      </section>
      <section class="col col--monitors" aria-labelledby="monitors-title">
        <div class="monitors" id="monitors" hidden>
          <h2 class="col__title" id="monitors-title"><span data-text="monitorsTitle"></span> <span class="count" id="monitors-count"></span></h2>
          <div class="monitors__failing" id="monitors-failing">
            <ul class="entries" id="monitors-down"></ul>
            <ul class="entries" id="monitors-pending"></ul>
          </div>
          <p class="monitors__ok" id="monitors-ok"></p>
          <div class="monitors__state" id="monitors-state"></div>
        </div>
      </section>
      </div>
      <div class="page page--calendar" id="page-calendar" role="region" hidden>
      <section class="col col--calendar" aria-labelledby="calendar-title">
        <h2 class="col__title" id="calendar-title"><span data-text="calendarTitle"></span></h2>
        <div class="now-next" id="now-next" hidden></div>
        <ol class="agenda" id="agenda"></ol>
        <p class="agenda-empty" id="agenda-empty" data-text="noEvents" hidden></p>
        <div class="calendar-state" id="calendar-state" hidden></div>
      </section>
      <section class="col col--tasks" aria-labelledby="tasks-title">
        <h2 class="col__title" id="tasks-title"><span data-text="tasksTitle"></span> <span class="count" id="tasks-count"></span></h2>
        <div class="tasks" id="tasks">
          <section class="task-list" id="issues-section" aria-labelledby="issues-title" hidden>
            <h3 class="section-title" id="issues-title" data-text="issuesTitle"></h3>
            <ul class="entries" id="issues"></ul>
          </section>
          <div class="task-lists" id="task-lists"></div>
        </div>
        <p class="tasks-empty" id="tasks-empty" data-text="noTasks" hidden></p>
        <div class="tasks-state" id="tasks-state" hidden></div>
      </section>
      </div>
      </div>
      <aside class="col col--status">
        <h1 class="wordmark">Stellwerk</h1>
        <p class="clock" id="clock"></p>
        <div class="hub-state" id="hub-state"></div>
        <p class="last-event" id="last-event"></p>
        <div class="page-tabs" id="page-tabs" role="tablist" hidden></div>
        <div class="status-details" id="status-details">
          <div class="log-state" id="rejected-state" hidden></div>
          <div class="log-state" id="raw-log-state" hidden></div>
          <div class="log-state" id="new-release-state" hidden></div>
          <div class="log-state" id="hardware-due-state" hidden></div>
          <div class="gauge-sections" id="gauge-sections">
            <section class="gauge-section" id="hardware" aria-labelledby="hardware-title" hidden>
              <h2 class="section-title" id="hardware-title" data-text="hardwareTitle"></h2>
              <dl class="gauges" id="gauges"></dl>
              <div class="hardware-state" id="hardware-state" hidden></div>
            </section>
            <div class="plans" id="plans" hidden></div>
          </div>
        </div>
        <footer class="az-signature">
          <span class="az-signature__mark">Azentrius</span>
          <span class="az-signature__meta"><span>Stellwerk {{version}}</span></span>
        </footer>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
