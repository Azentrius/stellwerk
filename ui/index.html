<!doctype html>
<!-- Stellwerk's display. The hub fills in {{session}} and {{scale}} when it serves the page.
     SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" class="pf-v6-theme-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="stellwerk-session" content="{{session}}">
    <meta name="stellwerk-scale" content="{{scale}}">
    <title>Stellwerk</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/azentrius.css">
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="board">
      <section class="col col--agents" aria-labelledby="agents-title">
        <h1 class="col__title" id="agents-title"><span data-text="agentsTitle"></span> <span class="count" id="agents-count"></span></h1>
        <ul class="agents" id="agents"></ul>
        <p class="agents-empty" id="agents-empty" data-text="noSessions" hidden></p>
      </section>
      <section class="col col--waiting" aria-labelledby="waiting-title">
        <h2 class="col__title" id="waiting-title"><span data-text="queueTitle"></span> <span class="count" id="waiting-count"></span></h2>
        <div class="waiting" id="waiting-list">
          <div class="queue" id="queue"></div>
          <section class="answers" id="answers-section" aria-labelledby="answers-title" hidden>
            <h3 class="section-title" id="answers-title" data-text="answersTitle"></h3>
            <ul class="answers__list" id="answers"></ul>
          </section>
          <section class="pulls" id="pulls-section" aria-labelledby="pulls-title" hidden>
            <h3 class="section-title" id="pulls-title" data-text="pullsTitle"></h3>
            <ul class="pulls__list" id="pulls"></ul>
          </section>
        </div>
        <div class="all-clear" id="waiting-empty" hidden>
          <span class="signal signal--working" aria-hidden="true"></span>
          <p data-text="allClear"></p>
        </div>
      </section>
      <section class="col col--spare" aria-hidden="true"></section>
      <aside class="col col--status">
        <p class="wordmark">Stell<span class="wordmark__werk">werk</span></p>
        <p class="clock" id="clock"></p>
        <p class="hub-state" id="hub-state"></p>
        <p class="last-event" id="last-event"></p>
        <p class="github-state" id="github-state" hidden></p>
        <section class="hardware" id="hardware" aria-labelledby="hardware-title" hidden>
          <h2 class="section-title" id="hardware-title" data-text="hardwareTitle"></h2>
          <dl class="gauges" id="gauges"></dl>
          <p class="hardware-state" id="hardware-state" hidden></p>
        </section>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
