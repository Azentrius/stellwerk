<!doctype html>
<!-- Stellwerk's display. The hub fills in the placeholders (session, scale, build, version) when it serves the page.
     SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" class="pf-v6-theme-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="stellwerk-session" content="{{session}}">
    <meta name="stellwerk-scale" content="{{scale}}">
    <meta name="stellwerk-build" content="{{build}}">
    <title>Stellwerk</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/azentrius.css">
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="board">
      <section class="col col--agents" aria-labelledby="agents-title">
        <h2 class="col__title" id="agents-title"><span data-text="agentsTitle"></span> <span class="count" id="agents-count"></span></h2>
        <ul class="entries agents" id="agents"></ul>
        <p class="agents-empty" id="agents-empty" data-text="noSessions" hidden></p>
      </section>
      <section class="col col--waiting" aria-labelledby="waiting-title">
        <h2 class="col__title" id="waiting-title"><span data-text="queueTitle"></span> <span class="count" id="waiting-count"></span></h2>
        <div class="waiting" id="waiting-list">
          <div class="queue" id="queue"></div>
          <section class="answers" id="answers-section" aria-labelledby="answers-title" hidden>
            <h3 class="section-title" id="answers-title" data-text="answersTitle"></h3>
            <ul class="entries" id="answers"></ul>
          </section>
          <section class="pulls" id="pulls-section" aria-labelledby="pulls-title" hidden>
            <h3 class="section-title" id="pulls-title" data-text="pullsTitle"></h3>
            <ul class="entries" id="pulls"></ul>
          </section>
        </div>
        <div class="az-empty all-clear" id="waiting-empty" hidden>
          <span class="az-empty__icon" id="all-clear-icon"></span>
          <p class="az-empty__title" data-text="allClear"></p>
        </div>
      </section>
      <section class="col col--spare" aria-hidden="true"></section>
      <aside class="col col--status">
        <h1 class="wordmark">Stellwerk</h1>
        <p class="clock" id="clock"></p>
        <div class="hub-state" id="hub-state"></div>
        <p class="last-event" id="last-event"></p>
        <div class="github-state" id="github-state" hidden></div>
        <div class="gauge-sections" id="gauge-sections">
          <section class="gauge-section" id="hardware" aria-labelledby="hardware-title" hidden>
            <h2 class="section-title" id="hardware-title" data-text="hardwareTitle"></h2>
            <dl class="gauges" id="gauges"></dl>
            <div class="hardware-state" id="hardware-state" hidden></div>
          </section>
          <div class="plans" id="plans" hidden></div>
        </div>
        <footer class="az-signature">
          <span class="az-signature__mark">Azentrius</span>
          <span class="az-signature__meta"><span>Stellwerk {{version}}</span></span>
        </footer>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
