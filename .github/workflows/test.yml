name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Windows, where Stellwerk runs: paths, the token file's permissions, the hub on 127.0.0.1.
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck (hub, tests, display)
        run: npm run typecheck
      - name: Build (hub and display)
        run: npm run build
      - name: Tests (status model, hook data, settings, configuration, the hub end to end)
        run: npm test
      - name: Display sign-in in a real Edge (another local service gets nothing to decide with)
        run: node tools/check-browser.ts
      - name: Known vulnerabilities in dependencies
        run: npm audit
      - name: Changelog has a section for the current version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node tools/release-notes.ts "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      # The release package, unpacked and installed as the README tells users, must start and serve the display.
      - name: Package, install it as a user would, start the hub
        shell: pwsh
        run: |
          npm run package
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive (Get-Item build/stellwerk-*.zip).FullName -DestinationPath $unpacked
          Set-Location (Get-ChildItem $unpacked -Directory)[0].FullName
          npm ci --omit=dev
          node dist/cli.js --version
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'localappdata'
          $hub = Start-Process node -ArgumentList 'dist/cli.js', 'serve' -NoNewWindow -PassThru
          try {
            Start-Sleep -Seconds 3
            # As a display uses it: locked without sign-in, signed in with the start file the hub wrote.
            node (Join-Path $env:GITHUB_WORKSPACE 'tools/check-install.ts') 4780
            if ($LASTEXITCODE -ne 0) { throw "The installed hub failed its check ($LASTEXITCODE)." }
          } finally {
            Stop-Process -Id $hub.Id
          }
