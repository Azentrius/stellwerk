# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs all tests on Windows, builds the package and creates the tag vVERSION with a
# GitHub release (package, SHA256SUMS, signed build provenance, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: the version in package.json)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything the test check runs, on Windows, where Stellwerk runs.
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck, build, tests
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Display sign-in in a real Edge (another local service gets nothing to decide with)
        run: node tools/check-browser.ts
      - name: Failing monitors in a real Edge (wheel, touch and keyboard reach the last one)
        run: node tools/check-monitors.ts
      - name: Agents and waiting column in a real Edge (the last entry, a card far down by tap and key)
        run: node tools/check-columns.ts
      - name: The display at rest in a real Edge (dims, what wakes it, a tap presses nothing)
        run: node tools/check-quiet.ts
      - name: Known vulnerabilities in dependencies
        run: npm audit

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # tag and release
      id-token: write       # signing the build provenance
      attestations: write   # storing the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the version and its changelog section
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(node -p "require('./package.json').version")
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.1.0."
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from package.json ($code). Change package.json first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          if ! node tools/release-notes.ts "$version" --require-date > /dev/null; then
            echo "::error::CHANGELOG.md has no dated section \"## $version – YYYY-MM-DD\"."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # This job can write releases and sign the provenance: install without running package scripts.
      - name: Build and package
        run: |
          npm ci --ignore-scripts
          npm run build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) npm run package

      - name: Build provenance for the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stellwerk-${{ steps.version.outputs.version }}.zip

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node tools/release-notes.ts "$VERSION" --require-date > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Download \`stellwerk-$VERSION.zip\` and \`SHA256SUMS\`, then in PowerShell:"
            echo
            echo '```powershell'
            echo "(Get-FileHash stellwerk-$VERSION.zip).Hash    # the same as in SHA256SUMS"
            echo "Expand-Archive stellwerk-$VERSION.zip -DestinationPath ."
            echo "cd stellwerk-$VERSION"
            echo "npm ci --omit=dev"
            echo '```'
            echo
            echo "Then follow the installation steps in the README. Check that the package was built by this repository's release workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify stellwerk-$VERSION.zip --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Stellwerk $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "build/stellwerk-$VERSION.zip" build/SHA256SUMS "$@"
